# Optional: deploy to cPanel over FTPS on every push to main.
# Add these repository secrets first (Settings → Secrets and variables → Actions):
#   CPANEL_FTP_SERVER    e.g. ftp.elifai.pk
#   CPANEL_FTP_USERNAME  an FTP account created in cPanel → FTP Accounts
#   CPANEL_FTP_PASSWORD
# Delete this file if you deploy with cPanel Git Version Control instead.
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CPANEL_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage public files
        run: |
          mkdir -p public
          cp -R assets public/
          cp .htaccess index.html privacy.html 404.html contact.php vendor-news.php robots.txt sitemap.xml site.webmanifest public/

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./public_html/
